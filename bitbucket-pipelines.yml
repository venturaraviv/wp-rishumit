image: atlassian/default-image:latest

pipelines:
  branches:
    main:
      - step:
          name: Deploy to WP Engine Production
          deployment: production
          clone:
            depth: full
          script:
            - echo "Deploying to WP Engine Production"
            - mkdir -p ~/.ssh
            - echo "$SSH_KEY_PROD" | base64 -d > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan git.wpengine.com >> ~/.ssh/known_hosts
            - git push --force git@git.wpengine.com:rishumit1.git main:master

    staging:
      - step:
          name: Deploy to Rishumit WP Engine Staging
          deployment: staging
          clone:
            depth: full
          script:
            - echo "Deploying to WP Engine Staging"
            - mkdir -p ~/.ssh
            - echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan git.wpengine.com >> ~/.ssh/known_hosts
            - git push --force git@git.wpengine.com:rishumitstg.git staging:master
